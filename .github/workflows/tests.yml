name: tests

# Runs the stdlib test suite on the platforms the product actually targets.
# No secrets, no services, no network fixtures: the suite builds its own
# temporary drives and synthetic MP4s.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: linux · py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the suite
        run: python -m unittest discover -s tests -t . -v

  # The product ships to macOS and Windows hosts. These jobs exist to find
  # platform assumptions before a customer does. They started as non-blocking;
  # on 11 Nov 2026 both went green (after catching a real Windows-only fixture
  # bug -- see docs/PROGRESS.md), so they now block like Linux does.
  #
  # This proves the *Python suite* is portable. It does NOT prove footage
  # scanning, NLE import, or a real WebDAV mount -- those still need user
  # machines; see docs/PROGRESS.md.
  other-platforms:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the suite
        run: python -m unittest discover -s tests -t .
