<style>:root{--bg:#0a0a0b;--bg2:#121214;--bg3:#17171a;--line:#232327;--line2:#2e2e33;--text:#f2f1ee;--dim:#8d8c92;--dim2:#6a6970;--lime:#c8ff4d;--ok:#54d17a;--bad:#ff6b6b}*{box-sizing:border-box;-webkit-font-smoothing:antialiased}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}.wrap{max-width:760px;margin:0 auto;padding:16px 16px 90px}header{display:flex;align-items:center;gap:10px;padding:8px 0 16px}.mark{width:26px;height:26px;border-radius:8px;background:var(--lime);color:#0a0a0b;display:grid;place-items:center;font-weight:800;font-size:14px}header b{font-size:14px}header span{color:var(--dim2);font-size:11px;display:block;text-transform:uppercase;letter-spacing:.05em}.player{aspect-ratio:16/9;background:#000;border:1px solid var(--line);border-radius:14px;display:grid;place-items:center;overflow:hidden;position:relative}.player .inside{text-align:center;color:var(--dim2);font-size:12px;padding:16px;line-height:1.7}.badge{position:absolute;left:10px;top:10px;font-size:10px;padding:2px 7px;border-radius:20px;border:1px solid var(--line2);background:#0a0a0bcc;color:var(--dim)}.bar{display:flex;align-items:center;gap:10px;margin:10px 2px 4px}.bar input[type=range]{flex:1;accent-color:var(--lime);height:3px}.tc{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}h1{font-size:16px;margin:14px 0 4px;letter-spacing:-.01em;overflow-wrap:anywhere}.sub{color:var(--dim2);font-size:12px;margin-bottom:14px}.card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}.c-head{display:flex;align-items:center;gap:8px;margin-bottom:5px}.av{width:22px;height:22px;border-radius:50%;background:#2b2b31;display:grid;place-items:center;font-size:10px;font-weight:700;color:#c9c7c1}.who{font-size:13px;font-weight:600}.when{color:var(--dim2);font-size:11px}.body{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.chip{display:inline-block;font-size:11px;border:1px solid var(--line2);border-radius:5px;padding:1px 6px;color:var(--lime);margin-right:6px;font-family:ui-monospace,monospace}.compose{position:fixed;left:0;right:0;bottom:0;background:#0e0e10ee;border-top:1px solid var(--line);padding:10px 16px;backdrop-filter:blur(8px)}.compose .inner{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}textarea{flex:1;background:var(--bg3);border:1px solid var(--line2);border-radius:10px;color:var(--text);padding:9px 11px;font:inherit;font-size:14px;resize:none;min-height:44px;outline:none}textarea:focus{border-color:#45454e}button{font:inherit;border:none;border-radius:10px;padding:10px 15px;cursor:pointer}.send{background:var(--lime);color:#0a0a0b;font-weight:700;font-size:14px}.send:disabled{opacity:.4}.ghost{background:var(--bg3);color:var(--text);border:1px solid var(--line2);font-size:12px;padding:8px 11px}.notice{border:1px solid #4a3a12;background:#1b1608;color:#e8c982;border-radius:10px;padding:10px 12px;font-size:12px;margin-bottom:12px;line-height:1.6}.notice.bad{border-color:#5c2c2c;background:#1f1212;color:#ffb3b3}.blocked{text-align:center;padding:44px 16px}.blocked h2{font-size:17px;margin:0 0 8px}.blocked p{color:var(--dim);font-size:13px;margin:0 auto;max-width:380px}.pin{display:grid;gap:8px;max-width:320px;margin:22px auto 0}.pin input{background:var(--bg3);border:1px solid var(--line2);border-radius:10px;padding:11px;color:var(--text);font:inherit;text-align:center}.fade{color:var(--dim2);font-size:11px;text-align:center;margin-top:22px;line-height:1.7}</style>
</head>
<body>

<div id="demo-banner" style="position:fixed;left:0;right:0;top:0;z-index:9999;
     background:#3a2f08;color:#f0d79a;border-bottom:1px solid #5c4a1f;
     font:12px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;padding:7px 14px;text-align:center">
  <b>Read-only demo snapshot</b> — captured 2026-10-23 from the synthetic sample drive.
  Nothing here is saved, no drive is connected, and no NLE is linked.
  <span style="opacity:.75">Run the host locally for the real thing.</span>
</div>
<style>body{padding-top:34px !important}</style>

<div class="wrap" id="app">
  <header><div class="mark">L</div>
    <div><b>Lumen review</b><span>shared by the production team</span></div></header>
  <div id="main"><div class="card">Loading…</div></div>
</div>

<script>window.__DEMO_GUEST__={"asset":{"id":"8b3bfe39-d642-4f12-8b43-a2d2a95656e5","name":"A001_C003.mp4","size_bytes":50331928,"media_kind":"video"},"version_label":"v1","allow_comments":true,"allow_download":false,"watermark":false,"expires_at":"2026-11-22T13:39:05+00:00","availability":{"state":"original_available","state_label":"Original available (host online)","host_online":true,"share_enabled":true,"drive_reachable":true,"original_available":true,"catalogue_available":true,"preview_available":false,"previews":[]},"comments":[{"id":"be0973ca-d9f4-45a5-8382-69f163027b12","asset_id":"8b3bfe39-d642-4f12-8b43-a2d2a95656e5","version_label":"v1","parent_id":null,"author":"Client Jane","author_kind":"guest","body":"Perfect for socials \u2014 can we hold this frame a beat longer?","timecode_ms":32000,"timecode_end_ms":null,"fps":25.0,"visibility":"shared","resolved_at":null,"created_at":"2026-10-23T06:56:40+00:00","timecode":"00:00:32:00","timecode_end":null,"reactions":[]},{"id":"cabac40f-a70d-4ff1-913f-c67cbe31b75b","asset_id":"8b3bfe39-d642-4f12-8b43-a2d2a95656e5","version_label":"v1","parent_id":"be0973ca-d9f4-45a5-8382-69f163027b12","author":"Simon Greene","author_kind":"member","body":"We'll need to play with the aspect ratio but agreed.","timecode_ms":32000,"timecode_end_ms":null,"fps":25.0,"visibility":"shared","resolved_at":null,"created_at":"2026-10-23T06:56:40+00:00","timecode":"00:00:32:00","timecode_end":null,"reactions":[]},{"id":"73f7f524-ff51-4b48-8daa-053fff1bd534","asset_id":"8b3bfe39-d642-4f12-8b43-a2d2a95656e5","version_label":"v1","parent_id":null,"author":"Client Jane","author_kind":"guest","body":"Approved from my phone after this note.","timecode_ms":84000,"timecode_end_ms":null,"fps":25.0,"visibility":"shared","resolved_at":null,"created_at":"2026-10-23T06:56:55+00:00","timecode":"00:01:24:00","timecode_end":null,"reactions":[]},{"id":"5dccb25a-af3a-4bc4-ad71-b554334ea9da","asset_id":"8b3bfe39-d642-4f12-8b43-a2d2a95656e5","version_label":"v1","parent_id":null,"author":"Jonathan Fern","author_kind":"member","body":"Still grading the other footage, but here's the sneak peek. The rest lands on the drive within the hour.","timecode_ms":120000,"timecode_end_ms":null,"fps":25.0,"visibility":"shared","resolved_at":null,"created_at":"2026-10-23T06:56:40+00:00","timecode":"00:02:00:00","timecode_end":null,"reactions":[]},{"id":"1d733112-59f1-4332-97d9-06aedbd42b76","asset_id":"8b3bfe39-d642-4f12-8b43-a2d2a95656e5","version_label":"v1","parent_id":"5dccb25a-af3a-4bc4-ad71-b554334ea9da","author":"Kai Nguyen","author_kind":"member","body":"I love it already.","timecode_ms":120000,"timecode_end_ms":null,"fps":25.0,"visibility":"shared","resolved_at":null,"created_at":"2026-10-23T06:56:40+00:00","timecode":"00:02:00:00","timecode_end":null,"reactions":[]}]};window.__DEMO_TOKEN__="qxOJjGSa1SZlbR-DZ3tf-3ahmkIBl_jz";</script>
<script>
(function(){
  const P = window.__DEMO_GUEST__;
  function res(body, status){ return { ok: status>=200&&status<300, status: status,
      async text(){ return body; }, async json(){ return JSON.parse(body); },
      async blob(){ return new Blob([body],{type:"application/json"}); } }; }
  const json = (o,s)=>res(JSON.stringify(o), s||200);
  window.fetch = async function(input, init){
    const m = ((init&&init.method)||"GET").toUpperCase();
    if (m !== "GET") return json({error:"read_only_demo",
        message:"Read-only snapshot: guest comments are not saved here."},403);
    return json(P || {error:"revoked"});
  };
})();
</script><script>
const TOKEN = decodeURIComponent(location.pathname.split("/").pop());
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtB = n => n>=1<<20 ? (n/(1<<20)).toFixed(1)+" MB" : n>=1024 ? (n/1024).toFixed(0)+" KB" : (n||0)+" B";
const tc = (ms, fps=25) => {
  if(ms == null) return "";
  const f = Math.round(ms/1000*fps); const s = Math.floor(f/fps);
  return [Math.floor(s/3600), Math.floor(s/60)%60, s%60, f%Math.round(fps)]
    .map((v,i)=> i? String(v).padStart(2,"0") : String(v).padStart(2,"0")).join(":");
};
const ago = iso => { if(!iso) return "";
  const d = (Date.now()-new Date(iso).getTime())/1000;
  if(d<60) return "just now"; if(d<3600) return Math.floor(d/60)+"m ago";
  if(d<86400) return Math.floor(d/3600)+"h ago"; if(d<172800) return "yesterday";
  return Math.floor(d/86400)+"d ago"; };

let PASS = sessionStorage.getItem("lfmc_pass_" + TOKEN) || null;
let STATE = null;
let POS_MS = 0;

async function load(){
  const r = await fetch(`/api/guest/${encodeURIComponent(TOKEN)}`, {
    headers: PASS ? {"X-LFMC-Passphrase": PASS} : {}
  });
  let data; try{ data = await r.json(); }catch(e){ data = {}; }

  if(!r.ok){
    if(data.error === "passphrase_required" || data.error === "passphrase_invalid"){
      return renderPassphrase(data.error === "passphrase_invalid");
    }
    return renderBlocked(data.error, data.message);
  }
  STATE = data;
  render();
}

function renderBlocked(code, message){
  const map = {
    revoked: ["This link was turned off", "The team revoked access to this review link."],
    expired: ["This link has expired", "Ask the team to send you a fresh review link."],
    "asset unavailable": ["Clip unavailable", "The file is no longer in this project."],
  };
  const [h, p] = map[code] || ["Link unavailable", message || "This review link is not available."];
  $("main").innerHTML = `<div class="blocked"><h2>${esc(h)}</h2><p>${esc(p)}</p></div>`;
}

function renderPassphrase(wrong){
  $("main").innerHTML = `
    <div class="blocked">
      <h2>Passphrase required</h2>
      <p>The team protected this review link. Enter the passphrase they sent you.</p>
      <div class="pin">
        <input id="pin" type="password" placeholder="Passphrase" autocomplete="off">
        ${wrong?'<div style="color:#ffb3b3;font-size:12px">That passphrase did not match.</div>':''}
        <button class="send" id="go">Open review</button>
      </div>
      <div class="fade">No account needed. Nothing is downloaded to this device.</div>
    </div>`;
  $("go").onclick = async () => {
    PASS = $("pin").value;
    sessionStorage.setItem("lfmc_pass_" + TOKEN, PASS);
    await load();
  };
  $("pin").addEventListener("keydown", e => { if(e.key === "Enter") $("go").click(); });
}

function render(){
  const a = STATE.asset, av = STATE.availability || {};
  const reachable = av.state === "original_available";
  const threads = STATE.comments.filter(c => !c.parent_id);
  const repliesOf = id => STATE.comments.filter(c => c.parent_id === id);

  $("main").innerHTML = `
    ${STATE.watermark ? `<div class="notice">This is a private review copy. Do not redistribute.</div>` : ""}
    ${reachable ? "" : `<div class="notice">The original is offline right now, so playback is
       unavailable. Your notes are still saved and the team will see them.</div>`}
    <div class="player">
      <div class="badge">${reachable ? "original on host drive" : "original offline"}</div>
      <div class="inside">
        ${reachable
          ? "Playback in this browser is not enabled yet.<br>Reviewing is available: scrub below and leave timecoded notes."
          : "Waiting for the host computer and drive to come back online."}
      </div>
    </div>
    <div class="bar">
      <span class="tc" id="pos">${tc(POS_MS)}</span>
      <input type="range" id="scrub" min="0" max="100" value="0">
      <span class="tc">${esc(STATE.version_label)}</span>
    </div>
    <h1>${esc(a.name)}</h1>
    <div class="sub">${fmtB(a.size_bytes)} · ${esc(STATE.version_label)}
      · ${STATE.expires_at ? "link expires " + esc(STATE.expires_at.slice(0,10)) : "no expiry"}</div>

    ${STATE.allow_comments ? "" : `<div class="notice">Commenting is turned off on this link.</div>`}

    <div id="thread">
      ${threads.length ? threads.map(c =>
        cardHtml(c) + repliesOf(c.id).map(r => cardHtml(r, true)).join("")).join("")
        : `<div class="card" style="text-align:center;color:var(--dim2);font-size:13px">
             No notes yet. Yours will appear here and the team sees them immediately.</div>`}
    </div>
    <div class="fade">This page shows one clip only. It cannot browse the team's folders,
      and it never downloads the original.</div>`;

  const scrub = $("scrub");
  scrub.oninput = () => { POS_MS = Number(scrub.value) * 1000 * 12; $("pos").textContent = tc(POS_MS); };
  if(STATE.allow_comments) renderCompose();
}

function cardHtml(c, isReply){
  return `<div class="card" ${isReply?'style="margin-left:18px;border-left:2px solid var(--line2)"':''}>
    <div class="c-head"><div class="av">${esc((c.author||"?").slice(0,2).toUpperCase())}</div>
      <span class="who">${esc(c.author)}</span>
      <span class="when">${ago(c.created_at)}</span></div>
    <div class="body">${c.timecode?`<span class="chip">${esc(c.timecode)}</span>`:""}${esc(c.body)}</div>
  </div>`;
}

function renderCompose(){
  const el = document.createElement("div");
  el.className = "compose";
  el.innerHTML = `<div class="inner">
      <div style="flex:1">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
          <input id="gname" value="${esc(localStorage.getItem("lfmc_name")||"")}"
            placeholder="Your name" style="background:var(--bg3);border:1px solid var(--line2);
            border-radius:8px;padding:6px 9px;color:var(--text);font:inherit;font-size:12px;width:150px">
          <button class="ghost" id="pinTc">@ ${tc(POS_MS)}</button>
        </div>
        <textarea id="gbody" placeholder="Leave a comment…"></textarea>
      </div>
      <button class="send" id="gsend">Send</button>
    </div>`;
  document.body.appendChild(el);

  let attachTc = false;
  $("pinTc").onclick = () => {
    attachTc = !attachTc;
    $("pinTc").style.borderColor = attachTc ? "var(--lime)" : "";
    $("pinTc").style.color = attachTc ? "var(--lime)" : "";
  };
  $("gsend").onclick = async () => {
    const body = $("gbody").value.trim();
    if(!body) return;
    const name = ($("gname").value || "Guest reviewer").trim();
    localStorage.setItem("lfmc_name", name);
    $("gsend").disabled = true;
    try{
      const r = await fetch(`/api/guest/${encodeURIComponent(TOKEN)}/comments`, {
        method:"POST",
        headers:{"Content-Type":"application/json",
                 ...(PASS ? {"X-LFMC-Passphrase": PASS} : {})},
        body: JSON.stringify({body, author:name, timecode_ms: attachTc ? POS_MS : null,
                              fps: 25})
      });
      if(!r.ok){ const j = await r.json().catch(()=>({})); throw new Error(j.message||"Send failed"); }
      $("gbody").value = "";
      await load();
    }catch(e){ alert(e.message); }
    finally{ if($("gsend")) $("gsend").disabled = false; }
  };
}

load();
</script>
</body>
